# Fleet syslog collector (aio-01 since 2026-11-25; replaced nas-01)
# Receives on UDP/TCP 514, writes per-host logs to /exports/log/.

module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

# Only the home LAN may send. Cabin traffic arrives via the pi-01 SSH tunnel,
# i.e. from pi-01's address, so it is covered.
$AllowedSender UDP, 192.168.1.0/24
$AllowedSender TCP, 192.168.1.0/24

# Per-host, per-program logs. Remote messages are handled here and STOPPED so
# they never fall through into aio-01's local log files. Split by source IP
# (fromhost-ip), not the spoofable sender-supplied hostname.
template(name="RemoteLogs" type="list") {
    constant(value="/exports/log/")
    property(name="hostname")
    constant(value="/")
    property(name="programname" caseConversion="lower")
    constant(value=".log")
}
if $fromhost-ip != "127.0.0.1" then {
    action(type="omfile" dynaFile="RemoteLogs" DirCreateMode="0750")
    stop
}
