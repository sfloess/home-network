# aio-01 — FLEET SYSLOG COLLECTOR (since 2026-11-25; replaced nas-01)
# /etc/rsyslog.d/collector.conf — receives on UDP/TCP 514, writes per-host
# logs to /exports/log/. Forwarders send to the hostname `rsyslog`, which
# the DNS zone maps to this host (192.168.1.15).

module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

template(name="RemoteLogs" type="list") {
    constant(value="")
    constant(value="/exports/log/")
    property(name="hostname")
    constant(value="/")
    property(name="programname" caseConversion="lower")
    constant(value=".log")
}
if $hostname != 'aio-01' then {
    action(type="omfile" dynaFile="RemoteLogs")
}
