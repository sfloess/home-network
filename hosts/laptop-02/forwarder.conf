# Forward all logs to aio-01 collector via local SSH tunnel (location-independent:
# works at home and cabin; spools to disk while the tunnel is down).
# Port 6514 = syslogd_port_t in SELinux, so rsyslogd_t may connect (5514 is
# unlabeled and gets "Permission denied" on SELinux-enforcing hosts).
action(type="omfwd" target="127.0.0.1" port="6514" protocol="tcp"
    queue.type="LinkedList" queue.filename="fwd_aio01" queue.maxDiskSpace="100m"
    queue.saveOnShutdown="on" action.resumeRetryCount="-1")
# laptop-02 variant also stamps the hostname (system name is the DHCP default):
# template(name="fwd_laptop02" type="string"
