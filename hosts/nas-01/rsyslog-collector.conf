# nas-01 — syslog collector (excerpt of /etc/rsyslog.conf, Debian chroot)
# Receives from fleet forwarders (util-ap chroot, pi-01, pi-02 send to
# the hostname "rsyslog", which the DNS zone maps to this host).

module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

# Per-host, per-program logs under /exports/log/
$template RemoteLogs,"/exports/log/%HOSTNAME%/%PROGRAMNAME%.log"
*.* ?RemoteLogs
