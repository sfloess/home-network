# ----------------------------------------------------------------

interface=br0
interface=wlan0
interface=wlan1
# ----------------------------------------------------------------

domain-needed
no-hosts
no-resolv
no-negcache
no-poll
stop-dns-rebind

dns-forward-max=200

# Never forward addresses in the non-routed address spaces.
bogus-priv

cache-size=3000

# ---------------------------------------------------------------------

domain=flossware.com
local=/flossware.com/

expand-hosts

localise-queries

# ---------------------------------------------------------------------

#server=/flossware.com/

# Bye bye ads and trackers!
#server=94.140.14.15
#server=94.140.15.16
# AdGuard DNS Family
server=94.140.14.140
server=94.140.15.141

# Send requests in parallel
#all-servers

# ---------------------------------------------------------------------

dhcp-leasefile=/tmp/dnsmasq.leases

# ---------------------------------------------------------------------

#log-queries
##log-facility=/opt/var/log/dnsmasq.log
log-async

# ---------------------------------------------------------------------

# Gateway
dhcp-option=3,192.168.1.1

# DNS server
dhcp-option=6,192.168.1.2

# NIS Domain
dhcp-option=40,flossware.com

# NTP
dhcp-option=42,192.168.1.2

# TFTP
#dhcp-option=66,192.168.1.53

# Wpad
#dhcp-option=252,"http://cloud-ap:8080/wpad.dat"

# PXE booting
#dhcp-boot=pxelinux.0,pi-02,192.168.1.11

dhcp-range=192.168.1.100,192.168.1.254,255.255.255.0,60m

dhcp-authoritative

# ---------------------------------------------------------------------
# Aliases
# ---------------------------------------------------------------------

#cname=fusion,redhat-workstation

