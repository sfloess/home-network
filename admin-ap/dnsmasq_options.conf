strict-order

# =====================================================================
#
# FlossWare Home Network
#
# Domain:   flossware.com
# Network:  192.168.1.0/24
# Gateway:  192.168.1.1
# DNS:      192.168.1.2
#
# =====================================================================


# ---------------------------------------------------------------------
# Interfaces
# ---------------------------------------------------------------------

interface=br0
interface=wlan0
interface=wlan1


# ---------------------------------------------------------------------
# DNS Configuration
# ---------------------------------------------------------------------

domain-needed
bogus-priv
stop-dns-rebind

no-hosts
no-resolv

domain=flossware.com
local=/flossware.com/

localise-queries

dns-forward-max=200
cache-size=3000

# AdGuard DNS Family
server=192.168.1.4
server=94.140.14.140
server=94.140.15.141


# ---------------------------------------------------------------------
# DHCP Configuration
# ---------------------------------------------------------------------

dhcp-leasefile=/tmp/dnsmasq.leases

dhcp-authoritative

dhcp-range=192.168.1.100,192.168.1.254,255.255.255.0,60m

# Default gateway
dhcp-option=3,192.168.1.1

# DNS server
dhcp-option=6,192.168.1.2,192.168.1.3

# NTP server
dhcp-option=42,192.168.1.2

# NIS domain (only enable if actually using NIS)
#dhcp-option=40,flossware.com


# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------

#log-queries
#log-facility=/opt/var/log/dnsmasq.log

log-async


# =====================================================================
# DNS HOST RECORDS
#
# Format:
# host-record=canonical-fqdn,short-name,alias1,alias2,IP
#
# First hostname is used for the reverse DNS record.
# =====================================================================


# ---------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------

host-record=gateway-ap.flossware.com,gateway-ap,192.168.1.1

host-record=admin-ap.flossware.com,admin-ap,ddclient.flossware.com,ddclient,dns.flossware.com,dns,mail.flossware.com,mail,ntp.flossware.com,ntp,192.168.1.2

host-record=util-ap.flossware.com,util-ap,192.168.1.3

host-record=server-ap.flossware.com,server-ap,192.168.1.4

host-record=desktop-ap.flossware.com,desktop-ap,192.168.1.5


# ---------------------------------------------------------------------
